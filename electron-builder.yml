appId: com.jobfinder.app
productName: Job Finder
directories:
  buildResources: build
  output: release
# Whitelist: only the compiled app ships. node_modules production deps are added
# automatically by electron-builder; e2e/, tests, docs, training-data, configs are excluded.
files:
  - out/**
  - package.json
  - '!**/*.{test,spec}.*'
  - '!**/*.map'
  # Size trimming (verified against the unpacked app; see PLAN/Phase 9a). The installer targets
  # win32-x64 only: better-sqlite3 loads prebuilds/win32-x64.node, so its sources, vendored
  # SQLite (deps), gyp output (build) and the other platforms' prebuilds are dead weight.
  - '!node_modules/better-sqlite3/{deps,src,build}/**'
  - '!node_modules/better-sqlite3/prebuilds/{darwin-arm64,darwin-x64,linux-arm64,linux-x64,linuxmusl-arm64,linuxmusl-x64,win32-arm64}.node'
  # Type declarations and docs are never read at runtime (drizzle-orm alone ships thousands).
  - '!**/node_modules/**/*.{d.ts,d.mts,d.cts,md,markdown}'
electronLanguages:
  - en-US # UI is English only; Hebrew job text is content, not a UI locale.
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
npmRebuild: true
win:
  executableName: job-finder
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
