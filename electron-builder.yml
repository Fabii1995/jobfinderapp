appId: com.jobfinder.app
productName: Job Finder
directories:
  buildResources: build
  output: release
# Whitelist: only the compiled app ships. node_modules production deps are added
# automatically by electron-builder; e2e/, tests, docs, training-data, configs are excluded.
files:
  - out/**
  - package.json
  - '!**/*.{test,spec}.*'
  - '!**/*.map'
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
npmRebuild: true
win:
  executableName: job-finder
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
